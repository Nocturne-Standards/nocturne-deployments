name: pins

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Tool tests
        run: uv run --project tools/nocturne-pins pytest -q tools/nocturne-pins/tests

      - name: Schema, replay, refs, tiers; logs only appended
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=""
          if [ -n "$BASE_REF" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          fi
          uv run --project tools/nocturne-pins nocturne-pins check --root . ${base:+--base "$base"}

      - name: Dusk snapshot equals the locked npm tarball (network)
        run: uv run --project tools/nocturne-pins nocturne-pins upstream verify --root . --warn-unreachable

      - name: No local paths
        run: python3 scripts/check-no-local-paths.py

      - name: Rust reader
        run: cargo test --locked
