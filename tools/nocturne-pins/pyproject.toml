[project]
name = "nocturne-pins"
version = "0.1.0"
description = "Read and write nocturne pin repos: per-product current files, append-only history, full-name resolver."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nocturne-pins = "nocturne_pins.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nocturne_pins"]

[dependency-groups]
dev = ["pytest>=8"]
